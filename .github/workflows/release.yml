name: Release Plugin Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify plugin manifest
        run: bash scripts/verify-plugin-manifest.sh

      - name: Build release archive (single-repo layout)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="cursor-ai-rules-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" \
            .cursor-plugin \
            .cursor \
            AGENTS.md \
            LICENSE \
            README.md
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
