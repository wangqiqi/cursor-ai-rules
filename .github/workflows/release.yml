name: Release Plugin Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync, verify, drift check
        run: |
          bash scripts/sync-plugin-package.sh
          bash scripts/verify-plugin-package.sh
          bash scripts/check-plugin-package-drift.sh

      - name: Build plugin archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="cursor-ai-rules-plugin-${VERSION}.tar.gz"
          tar -czf "$ARCHIVE" -C packages cursor-ai-rules-plugin
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
