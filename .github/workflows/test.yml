name: Cursor AI Rules CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 jq（插件校验）
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: 核心层测试
        run: bash .cursor/tests/test-common.sh
      - name: Agent 编排集成测试
        run: bash .cursor/tests/test-agent-orchestration.sh
      - name: 系统验证测试
        run: bash .cursor/tests/run-verify-test.sh
      - name: Shell 语法检查
        run: |
          for f in .cursor/core/*.sh .cursor/cursor-master.sh; do
            bash -n "$f" && echo "✅ $f" || echo "❌ $f"
          done
      - name: 同步、校验插件包并检查漂移
        run: |
          bash scripts/sync-plugin-package.sh
          bash scripts/verify-plugin-package.sh
          bash scripts/check-plugin-package-drift.sh
