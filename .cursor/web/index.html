<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor AI Master - 智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .command-panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .command-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .command-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .output-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dee2e6;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            margin-right: 8px;
        }

        .status-indicator.loading {
            background: #ffc107;
            animation: pulse 2s infinite;
        }

        .status-indicator.error {
            background: #dc3545;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .output-content {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-card, .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .status-card h3, .history-card h3 {
            margin-bottom: 15px;
            color: #495057;
            font-size: 1.2rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .status-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .status-label {
            font-weight: 500;
        }

        .status-value {
            color: #6c757d;
            font-family: monospace;
        }

        .history-item {
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-command {
            font-weight: 600;
            margin-bottom: 5px;
            color: #495057;
        }

        .history-time {
            font-size: 12px;
            color: #6c757d;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
        }

        .quick-commands {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 15px;
        }

        .quick-cmd {
            padding: 8px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-cmd:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Cursor AI Master</h1>
            <p>智能编程助手 - 让AI成为您的得力助手</p>
        </div>

        <div class="main-content">
            <div class="command-panel">
                <h2>💬 智能命令输入</h2>
                <p style="color: #6c757d; margin-bottom: 20px;">用自然语言描述您的需求，AI将自动为您执行</p>

                <input
                    type="text"
                    class="command-input"
                    id="commandInput"
                    placeholder="例如：创建一个React项目，优化代码质量，分析项目结构..."
                    onkeypress="handleKeyPress(event)"
                >

                <div class="button-group">
                    <button class="btn btn-primary" onclick="executeCommand()">🚀 执行命令</button>
                    <button class="btn btn-secondary" onclick="clearOutput()">🧹 清空输出</button>
                </div>

                <div class="quick-commands">
                    <div class="quick-cmd" onclick="setCommand('创建一个React项目')">创建React项目</div>
                    <div class="quick-cmd" onclick="setCommand('优化代码质量')">优化代码质量</div>
                    <div class="quick-cmd" onclick="setCommand('分析项目结构')">分析项目结构</div>
                    <div class="quick-cmd" onclick="setCommand('检查代码规范')">检查代码规范</div>
                    <div class="quick-cmd" onclick="setCommand('运行测试')">运行测试</div>
                    <div class="quick-cmd" onclick="setCommand('部署应用')">部署应用</div>
                </div>

                <div class="output-panel">
                    <div class="output-header">
                        <h3>
                            <span class="status-indicator" id="statusIndicator"></span>
                            执行结果
                        </h3>
                        <small id="timestamp"></small>
                    </div>
                    <div class="output-content" id="outputContent">
                        欢迎使用 Cursor AI Master！<br>
                        在上方输入框中描述您的需求，或点击快速命令开始使用。
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="status-card">
                    <h3>📊 系统状态</h3>
                    <div id="statusContent">
                        <div class="status-item">
                            <span class="status-label">连接状态</span>
                            <span class="status-value" id="connectionStatus">检查中...</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">项目根目录</span>
                            <span class="status-value" id="projectRoot">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">AI助手状态</span>
                            <span class="status-value" id="aiStatus">-</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">学习数据</span>
                            <span class="status-value" id="learningData">-</span>
                        </div>
                    </div>
                </div>

                <div class="history-card">
                    <h3>📝 命令历史</h3>
                    <div id="historyContent">
                        <small style="color: #6c757d;">暂无历史记录</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isExecuting = false;

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus();
            loadHistory();
        });

        // 处理回车键执行命令
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeCommand();
            }
        }

        // 设置快速命令
        function setCommand(command) {
            document.getElementById('commandInput').value = command;
        }

        // 执行命令
        async function executeCommand() {
            if (isExecuting) return;

            const commandInput = document.getElementById('commandInput');
            const command = commandInput.value.trim();

            if (!command) {
                showError('请输入命令');
                return;
            }

            isExecuting = true;
            setStatus('loading');

            const outputContent = document.getElementById('outputContent');
            const timestamp = document.getElementById('timestamp');

            // 显示执行状态
            outputContent.innerHTML = '<div class="loading"></div>正在执行命令...';
            timestamp.textContent = new Date().toLocaleTimeString();

            try {
                const response = await fetch('/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        command: command,
                        cwd: window.location.pathname // 当前工作目录
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // 检查是否是宪法响应
                    if (result.type === 'constitution_response') {
                        setStatus(result.constitution && result.constitution.compliant === false ? 'error' : 'success');
                    } else {
                        setStatus('success');
                    }
                    displayResult(result);
                } else {
                    setStatus('error');
                    displayError(result);
                }

                // 保存到历史记录
                saveToHistory(command, result.success);

            } catch (error) {
                setStatus('error');
                outputContent.innerHTML = `<div class="error-message">网络错误: ${error.message}</div>`;
            } finally {
                isExecuting = false;
            }
        }

        // 显示执行结果
        function displayResult(result) {
            const outputContent = document.getElementById('outputContent');
            let html = '';

            // 处理宪法响应 (constitution_response)
            if (result.type === 'constitution_response' && result.message) {
                if (result.constitution && result.constitution.compliant === false) {
                    html += `<div class="error-message">⚖️ 宪法保护机制激活</div>`;
                }
                // 转换markdown为简单HTML
                const formattedMessage = formatMarkdown(result.message);
                html += `<div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px;">${formattedMessage}</div>`;
            }
            // 处理普通输出
            else if (result.output) {
                html += `<div class="success-message">✅ 命令执行成功</div>`;
                html += `<pre style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 10px;">${escapeHtml(result.output)}</pre>`;
            }

            // 处理状态更新
            if (result.statusUpdates && result.statusUpdates.length > 0) {
                html += '<h4>📊 执行状态:</h4><ul>';
                result.statusUpdates.forEach(update => {
                    html += `<li>${escapeHtml(update)}</li>`;
                });
                html += '</ul>';
            }

            outputContent.innerHTML = html;
        }

        // 显示错误信息
        function displayError(result) {
            const outputContent = document.getElementById('outputContent');
            let html = `<div class="error-message">❌ 命令执行失败</div>`;

            if (result.error) {
                html += `<p><strong>错误信息:</strong> ${escapeHtml(result.error)}</p>`;
            }

            if (result.stderr) {
                html += `<p><strong>详细错误:</strong></p><pre style="background: #f8f9fa; padding: 10px; border-radius: 4px;">${escapeHtml(result.stderr)}</pre>`;
            }

            if (result.errorDetails && result.errorDetails.length > 0) {
                html += '<p><strong>关键错误行:</strong></p><ul>';
                result.errorDetails.forEach(detail => {
                    html += `<li>${escapeHtml(detail)}</li>`;
                });
                html += '</ul>';
            }

            outputContent.innerHTML = html;
        }

        // 设置状态指示器
        function setStatus(status) {
            const indicator = document.getElementById('statusIndicator');

            switch (status) {
                case 'loading':
                    indicator.className = 'status-indicator loading';
                    break;
                case 'success':
                    indicator.className = 'status-indicator';
                    break;
                case 'error':
                    indicator.className = 'status-indicator error';
                    break;
                default:
                    indicator.className = 'status-indicator';
            }
        }

        // 显示错误消息
        function showError(message) {
            const outputContent = document.getElementById('outputContent');
            outputContent.innerHTML = `<div class="error-message">${message}</div>`;
        }

        // 清空输出
        function clearOutput() {
            const outputContent = document.getElementById('outputContent');
            outputContent.innerHTML = '输出已清空。请输入新命令开始使用。';
            document.getElementById('timestamp').textContent = '';
            setStatus('success');
        }

        // 更新系统状态
        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                document.getElementById('connectionStatus').textContent = '正常';
                document.getElementById('projectRoot').textContent = status.projectRoot || '-';
                document.getElementById('aiStatus').textContent = status.hasCursor ? '已激活' : '未激活';
                document.getElementById('learningData').textContent = status.learningFiles ? `${status.learningFiles}个文件` : '无';

            } catch (error) {
                document.getElementById('connectionStatus').textContent = '连接失败';
                console.error('获取状态失败:', error);
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                const data = await response.json();

                const historyContent = document.getElementById('historyContent');

                if (data.history && data.history.length > 0) {
                    historyContent.innerHTML = data.history.map(item => `
                        <div class="history-item">
                            <div class="history-command">${escapeHtml(item.command)}</div>
                            <div class="history-time">${new Date(item.timestamp).toLocaleString()}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('加载历史记录失败:', error);
            }
        }

        // 保存到历史记录
        function saveToHistory(command, success) {
            // 这里可以发送到服务器保存
            // 暂时只在客户端更新显示
            loadHistory();
        }

        // 格式化宪法响应消息
        function formatMarkdown(text) {
            // 保留原始换行和基本格式，直接用pre标签显示
            return `<pre style="white-space: pre-line; font-family: inherit; margin: 0; line-height: 1.6;">${escapeHtml(text)}</pre>`;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 定期更新状态
        setInterval(updateStatus, 30000); // 每30秒更新一次状态
    </script>
</body>
</html>
